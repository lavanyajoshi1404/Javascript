<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Click me</button>
    
</body>
<script>
    class React{
        constructor(){
            this.library="React";
            this.server="Node.js";
            //requirement
            document.querySelector('button').addEventListener('click', this.handleClick.bind(this));

        }
        handleClick(){
            console.log("Button clicked");
            console.log(`Using ${this.library} with ${this.server}`);
        }
    }

    const app = new React();
</script>

</html>
